name: Build
on:
    workflow_dispatch:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
env:
    CARGO_TERM_COLOR: always
jobs:
    build:
        name: Build windows
        runs-on: windows-latest
        strategy:
            matrix:
                include:
                    - target: i686-win7-windows-msvc
                      filename: pocket-relay-plugin.asi

        steps:
            # Checkout the repo for building
            - uses: actions/checkout@v4

              # Setup rust for building the plugin
            - name: Install Rust
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: ${{ matrix.target }}

            # Cache Rust dependencies and build artifacts
            - name: Cache Rust dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.target }}-cargo-

            - name: Build Client
              run: cargo build --verbose --release --target ${{ matrix.target }} -p pocket-relay-plugin

            - name: Run tests
              run: cargo test --verbose --target ${{ matrix.target }} -p pocket-relay-plugin

            # Copy built binary to output directory
            - name: Rename and move output binary
              run: cp target/${{ matrix.target }}/release/pocket_relay_plugin.dll ${{ matrix.filename }}
              shell: bash

            # Upload the built artifact
            - name: Upload binary artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.filename }}
                  path: ${{ matrix.filename }}
