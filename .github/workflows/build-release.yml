name: Build Release

on:
    # This will trigger when a tag like v1.0.0 is pushed
    # will create a release
    push:
        tags:
            - "v*.*.*"
    # Manual trigger for creating an artifact (button in the UI)
    workflow_dispatch:

permissions:
    packages: write
    contents: write

jobs:
    build:
        name: Build Windows target
        runs-on: windows-latest
        strategy:
            matrix:
                include:
                    - target: i686-pc-windows-msvc
                      toolchain: 1.75.0
                      filename: pocket-relay-plugin.asi

        steps:
            # Checkout the repo for building
            - uses: actions/checkout@v4

            # Setup rust for building the plugin
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
                  toolchain: ${{ matrix.toolchain }}

            # Cache Rust dependencies and build artifacts
            - name: Cache Rust dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.target }}-cargo-

            # Build the binary
            - name: Build
              run: cargo build --release --target ${{ matrix.target }} -p pocket-relay-plugin

            # Copy built binary to output directory
            - name: Rename and move output binary
              run: cp target/${{ matrix.target }}/release/pocket_relay_plugin.dll ${{ matrix.filename }}
              shell: bash

            # Upload the built artifact
            - name: Upload binary artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.filename }}
                  path: ${{ matrix.filename }}

    release:
        name: Create Release
        runs-on: ubuntu-latest
        needs: [build]

        steps:
            # Checkout the repo
            - uses: actions/checkout@v4

            # Download all the compiled artifacts from previous
            # steps
            - name: Download all build artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            # Create the github release if we pushed up a new tag
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              if: github.event_name == 'push'
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  draft: true
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
